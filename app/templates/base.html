<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script>
  // 在样式生效前就把主题定下来，避免刷新时闪一下白屏
  (function () {
    try {
      var t = localStorage.getItem('bisTheme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="inner">
    <a class="brand" href="/">BIS Working Papers Monitor</a>
    <nav aria-label="Main navigation">
      <a href="/" {% if nav == 'papers' %}aria-current="page"{% endif %}>Papers</a>
      <a href="/thesis" {% if nav == 'thesis' %}aria-current="page"{% endif %}>Chinese notes</a>
      <a href="/runs" {% if nav == 'runs' %}aria-current="page"{% endif %}>Run history</a>
      <a href="https://www.bis.org/publications/working-paper" target="_blank" rel="noopener">
        {# aria-label 加在无角色的 span 上会被忽略，得用真实文本 #}
        BIS website <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new window)</span>
      </a>
      <button class="theme-toggle" id="themeToggle" type="button"
              aria-label="Toggle light/dark theme" title="Toggle light/dark theme">◐</button>
    </nav>
  </div>
</header>

<main id="main" class="inner" tabindex="-1">
  {% block content %}{% endblock %}
</main>

<footer class="inner foot">
  <span>bis-wpapers-monitor</span><span>·</span><span>{{ now }}</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ---- 主题切换 ----
  (function () {
    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var isDark = root.dataset.theme
        ? root.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
      var next = isDark ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('bisTheme', next); } catch (e) {}
    });
  })();

  // ---- Copy到剪贴板 ----
  // 写论文时最高频的动作就是「把Citation和系数抄进稿子」，所以做成全局能力。
  window.toast = function (msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  };

  window.copyText = function (text, label) {
    function done() { window.toast((label || 'Content') + ' copied'); }
    function fallback() {
      // 非 HTTPS 或旧浏览器下 navigator.clipboard 不可用
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { window.toast('Copy failed; please select the text manually'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  };

  // data-copy="选择器" —— Copy该元素的纯文本
  //
  // 不能直接用 src.innerText：Copy按钮本身就在被Copy的容器里，
  // 而 .sec-actions 只设了 opacity:0（仍占布局），innerText 会把它算进去。
  // Result是粘进论文的正文里夹着「Copy section」「⧉ Copy citation」「#」这些界面文字。
  // 做法是先克隆一份、剔掉界面元素，再取 innerText —— innerText 依赖布局，
  // 所以克隆体要短暂挂进文档，用 clip 藏起来而不是 display:none。
  var CHROME = 'button, .sec-actions, [data-copy], .anchor, [data-noncopy]';

  function plainTextOf(src) {
    var clone = src.cloneNode(true);
    clone.querySelectorAll(CHROME).forEach(function (el) { el.remove(); });
    clone.style.position = 'fixed';
    clone.style.left = '0';
    clone.style.top = '0';
    clone.style.clip = 'rect(0 0 0 0)';
    clone.style.clipPath = 'inset(50%)';
    clone.setAttribute('aria-hidden', 'true');
    document.body.appendChild(clone);
    var text = clone.innerText;
    document.body.removeChild(clone);
    // 折叠三个以上连续空行，段落间保留一个空行
    return text.replace(/\n{3,}/g, '\n\n').trim();
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-copy]');
    if (!btn) return;
    var src = document.querySelector(btn.dataset.copy);
    if (!src) return;
    window.copyText(plainTextOf(src), btn.dataset.copyLabel);
  });

  // ---- 「返回」保住来处的Search词与页码 ----
  // href 仍指向 /，所以没有 JS 或直接打开链接时依然可用；
  // 只有确认来自本站时才改成后退，否则会退到站外去。
  document.addEventListener('click', function (e) {
    var link = e.target.closest('a[data-back]');
    if (!link || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    var ref = document.referrer;
    if (!ref) return;
    try {
      if (new URL(ref).origin !== location.origin) return;
    } catch (err) { return; }
    if (new URL(ref).pathname === location.pathname) return;  // 刷新过，别退回自己
    e.preventDefault();
    history.back();
  });

  // ---- 按 / 聚焦Search框 ----
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
    var box = document.querySelector('[data-search-input]');
    if (box) { e.preventDefault(); box.focus(); box.select(); }
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
